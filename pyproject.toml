[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-reward"
version = "0.1.0"
description = "Evaluate spatial understanding in text-to-image generation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "SpatialReward Team"},
]
keywords = ["spatial", "reward", "image-generation", "evaluation", "text-to-image"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch==2.6.0",
    "transformers>=4.37",
    "huggingface-hub>=0.20",
    "numpy>=1.24",
    "Pillow>=9.0",
    "open-clip-torch>=2.20",
    "clip-benchmark>=1.4",
    "rembg>=2.0",
    "onnxruntime>=1.15",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "python-Levenshtein>=0.21"]
qwen = ["qwen-vl-utils>=0.0.2"]
all = ["spatial-reward[ocr,qwen]"]
dev = ["pytest>=7.0"]

[project.scripts]
spatial-reward = "spatial_reward.cli:main"

[project.urls]
Homepage = "https://github.com/spatial-reward/SpatialReward"
Repository = "https://github.com/spatial-reward/SpatialReward"

[tool.setuptools.packages.find]
where = ["."]
include = ["spatial_reward*"]

[tool.setuptools.package-data]
spatial_reward = ["../assets/*.obj", "../assets/*.png"]
